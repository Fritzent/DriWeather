name: andri_driweather
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  d_session: ^0.0.3
  flutter_bloc: ^9.0.0
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.3
  flutter_svg: ^2.0.16
  fluttertoast: ^8.2.10
  gap: ^3.0.1
  google_fonts: ^6.2.1
  http: ^1.3.0
  intl: ^0.20.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4
  
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_native_splash:
      image: "assets/images/ic_logo_weather_app.png"
      color: "#47BFDF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_logo_weather.png"
  adaptive_icon_foreground: "assets/images/ic_logo_weather_app.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  icon_size: 24

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/images/ic_logo_weather.png
    - assets/icons/
